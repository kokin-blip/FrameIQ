[workspace]
resolver = "2"
members = ["crates/contracts", "crates/analysis", "crates/inference", "crates/ai-worker", "crates/domain", "crates/media", "crates/persistence", "crates/application", "crates/worker", "apps/desktop/src-tauri"]
[workspace.package]
version = "0.1.3"
edition = "2021"
[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
sha2 = "0.10"
thiserror = "2"
rusqlite = { version = "0.40", features = ["bundled", "backup"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
ts-rs = { version = "11", features = ["serde-compat"] }
ffmpeg-next = { version = "8", default-features = false, features = ["codec", "format", "software-scaling", "filter"] }
tempfile = "3"
[profile.release]
lto = "thin"
codegen-units = 1
strip = true
