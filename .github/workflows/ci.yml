name: FrameIQ checks
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      soak:
        description: Run a two-hour backend soak instead of the ten-minute smoke
        type: boolean
        default: false
env:
  FRAMEIQ_STRESS_SECONDS: ${{ inputs.soak && '7200' || '600' }}
permissions:
  contents: read
jobs:
  contracts-and-ui:
    strategy:
      matrix:
        os: [macos-14, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: rustup update stable --no-self-update
      - run: rustup default stable
      - run: npm ci
      - run: npm run check
      - run: npm test
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tools -p test_validate_corpus.py
      - run: npm run build
      - run: cargo test -p frameiq-contracts -p frameiq-domain -p frameiq-persistence
      - run: cargo test --locked -p frameiq-inference --lib
      - run: cargo check -p frameiq-application
      - run: npm run contracts:check
  macos-media:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - run: rustup update stable --no-self-update
      - run: rustup default stable
      - run: brew install pkg-config gnupg llvm autoconf automake libtool
      - uses: actions/cache@v4
        id: native-cache
        with:
          path: .native/ffmpeg
          key: native-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tools/build-ffmpeg.sh') }}
      - run: bash tools/build-ffmpeg.sh
        if: steps.native-cache.outputs.cache-hit != 'true'
      - name: Native fidelity and offline integration
        shell: bash
        run: |
          export LIBCLANG_PATH="$(brew --prefix llvm)/lib"
          source tools/native-env.sh
          cargo build -p frameiq-worker
          cargo test --workspace --exclude frameiq-desktop --features frameiq-application/fault-injection
      - name: Measured backend resource smoke
        shell: bash
        run: |
          source tools/native-env.sh
          mkdir -p .cache/resource-evidence
          ffmpeg -hide_banner -loglevel error -y -f lavfi -i testsrc2=size=640x360:rate=10:duration=3 -c:v ffv1 .cache/resource-evidence/source.mkv
          cargo run --locked -p frameiq-application --bin benchmark -- .cache/resource-evidence/source.mkv "$PWD/target/debug/frameiq-worker" .cache/resource-evidence/backend.json 20 "$FRAMEIQ_STRESS_SECONDS"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: FrameIQ-macos-resource-evidence
          path: .cache/resource-evidence/*.json
  windows-native:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - run: npm ci
      - uses: actions/cache@v4
        id: native-cache
        with:
          path: .native/ffmpeg
          key: native-${{ runner.os }}-${{ runner.arch }}-${{ env.VCToolsVersion }}-${{ env.UCRTVersion }}-${{ hashFiles('tools/build-windows.ps1', 'tools/vcpkg-overlay/**') }}
      - name: Build pinned MSVC media engine and native fidelity fixtures
        shell: pwsh
        run: ./tools/build-windows.ps1
        if: steps.native-cache.outputs.cache-hit != 'true'
      - name: Native regression tests with cached engine
        if: steps.native-cache.outputs.cache-hit == 'true'
        shell: pwsh
        run: |
          $env:FFMPEG_DIR = "$pwd/.native/ffmpeg"
          $env:LIBCLANG_PATH = 'C:\Program Files\LLVM\bin'
          $env:PATH = "$pwd/.native/ffmpeg/bin;$env:PATH"
          cargo build --locked -p frameiq-worker -p frameiq-ai-worker
          if($LASTEXITCODE){throw 'Cached-engine worker build failed'}
          cargo test --locked --workspace --exclude frameiq-desktop --features frameiq-application/fault-injection
          if($LASTEXITCODE){throw 'Cached-engine regression failed'}
      - name: Measured backend resource smoke
        shell: pwsh
        run: |
          $env:FFMPEG_DIR = "$pwd/.native/ffmpeg"
          $env:LIBCLANG_PATH = 'C:\Program Files\LLVM\bin'
          $env:PATH = "$pwd/.native/ffmpeg/bin;$env:PATH"
          New-Item -ItemType Directory -Force .cache/windows-evidence | Out-Null
          & "$env:FFMPEG_DIR/bin/ffmpeg.exe" -hide_banner -loglevel error -y -f lavfi -i 'testsrc2=size=640x360:rate=10:duration=3' -c:v ffv1 .cache/windows-evidence/source.mkv
          if($LASTEXITCODE){throw 'Stress fixture failed'}
          cargo run --locked -p frameiq-application --bin benchmark -- .cache/windows-evidence/source.mkv "$pwd/target/debug/frameiq-worker.exe" .cache/windows-evidence/backend.json 20 $env:FRAMEIQ_STRESS_SECONDS
          if($LASTEXITCODE){throw 'Resource smoke failed'}
      - run: node tools/prepare-onnxruntime.mjs
      - name: Bundle private installer and audit dependencies
        shell: pwsh
        run: ./tools/package-windows.ps1
      - name: Installed worker smoke with isolated PATH
        shell: pwsh
        run: ./tools/smoke-windows-install.ps1
      - name: Retain native failure logs
        if: always()
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force .cache/windows-evidence/native-logs | Out-Null
          foreach($port in @('ffmpeg','zimg')) {
            $root = "C:/frameiq-native/vcpkg/buildtrees/$port"
            if(Test-Path $root) {
              Get-ChildItem $root -Filter '*.log' | ForEach-Object { Copy-Item $_.FullName ".cache/windows-evidence/native-logs/$port-$($_.Name)" -Force }
            }
          }
      - uses: actions/upload-artifact@v4
        with:
          name: FrameIQ-private-windows-x64
          path: target/release/bundle/nsis/*.exe
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: FrameIQ-windows-acceptance-evidence
          path: |
            .cache/windows-evidence/**
            .native/ffmpeg/build-config.mak
