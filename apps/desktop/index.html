<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#1b1b1b" />
    <meta name="application-name" content="FrameIQ" />
    <link rel="icon" href="/brand/favicon.ico" sizes="any" />
    <link rel="icon" type="image/svg+xml" href="/brand/app-icon.svg" />
    <title>FrameIQ</title>
    <style>
      html,
      body,
      #root {
        height: 100%;
        margin: 0;
      }
      body {
        background: #1b1b1b;
      }
      .app-startup {
        min-height: 100%;
        display: grid;
        place-content: center;
        justify-items: center;
        gap: 12px;
        background: #1b1b1b;
        color: #f5f5f5;
        font:
          14px Inter,
          sans-serif;
      }
      .app-startup p {
        margin: 0;
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="app-startup" role="status">
        <img
          src="/brand/app-icon.svg"
          width="64"
          height="64"
          alt=""
          aria-hidden="true"
        />
        <p>Starting FrameIQ…</p>
        <noscript>Enable JavaScript to open FrameIQ.</noscript>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
